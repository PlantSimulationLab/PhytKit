name: CI

# Tests on pushes to main and on every pull request. Wheels and PyPI publishing live in release.yml
# (tag-triggered); the docs site is deployed by docs.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Test
        run: cargo test --release

  msrv:
    name: Rust 1.88 (minimum supported)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-latest (26.04) has no Python 3.9 for setup-python.
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The tests compare phytkit.run against the pk binary in target/release.
      - name: Build pk
        run: cargo build --release
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin pytest pyyaml
          maturin build --release -m crates/py/Cargo.toml --out dist
          python -m pip install --no-index --find-links dist phytkit
      - name: pytest
        run: python -m pytest crates/py/tests -v
      - name: pk entry point
        run: pk describe fvcb

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: cargo build --release
      - name: Every pk example in the docs runs
        run: sh docs/check_examples.sh
      - name: Model reference page is up to date
        run: |
          python3 docs/gen_models.py
          git diff --exit-code -- docs/docs/reference/models.md \
            || { echo "::error::docs/docs/reference/models.md is stale: run python3 docs/gen_models.py and commit"; exit 1; }
      - name: MkDocs build (strict)
        working-directory: docs
        run: |
          pip install -r requirements.txt
          mkdocs build --strict
