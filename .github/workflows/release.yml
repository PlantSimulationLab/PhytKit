name: Release

# Builds abi3 wheels (one per platform, any Python >= 3.9) and an sdist, installs and tests
# each wheel, then publishes to PyPI and creates a GitHub release.
#
# To release: bump workspace.package.version in Cargo.toml, commit, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The tag must match the Cargo version or the run stops before building.
#
# workflow_dispatch is a dry run: it builds and tests everything but never publishes.
#
# PyPI Trusted Publishing: no token is stored. The publisher is registered on pypi.org for
# THIS file name (release.yml) and environment `pypi`; renaming either breaks publishing
# until it is updated there.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          tag_version="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml: $cargo_version, tag: $tag_version"
          [ "$cargo_version" = "$tag_version" ] \
            || { echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"; exit 1; }

  wheels:
    name: Wheel ${{ matrix.platform }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { platform: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { platform: windows-x86_64, os: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        env:
          # Recorded in the wheel for phytkit.build_info(); see crates/py/build.rs.
          PHYTKIT_GIT_COMMIT: ${{ github.sha }}
          PHYTKIT_BUILD_KIND: release
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # The manylinux build runs in a container; pass the two variables into it.
          docker-options: -e PHYTKIT_GIT_COMMIT -e PHYTKIT_BUILD_KIND
          args: --release --out dist -m crates/py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl

  sdist:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Install each built wheel into a clean Python and run the test suite against it. Runs on
  # the oldest and newest supported Python, since one abi3 wheel serves both.
  test-wheels:
    name: Test ${{ matrix.platform }} / Python ${{ matrix.python }}
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, linux-aarch64, macos-arm64, windows-x86_64]
        python: ["3.9", "3.13"]
        include:
          # ubuntu-24.04, not -latest: 26.04 has no Python 3.9 for setup-python.
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: linux-aarch64, os: ubuntu-24.04-arm }
          - { platform: macos-arm64, os: macos-latest }
          - { platform: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist
      - name: Install wheel
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install --no-index --find-links dist phytkit
      # Tests that compare against target/release/pk skip here; ci.yml runs them.
      - name: pytest
        run: python -m pytest crates/py/tests -v
      - name: pk entry point
        run: pk describe fvcb

  publish-pypi:
    name: Publish to PyPI
    needs: [wheels, sdist, test-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/phytkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      # PyPI never accepts the same version twice; skip-existing makes a re-run harmless.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  github-release:
    name: GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
